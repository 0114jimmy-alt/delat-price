<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>早餐店大忙人</title>

<style>

*{box-sizing:border-box}

html,body{margin:0;width:100%;height:100%;overflow:hidden}

body{background:linear-gradient(145deg,#fbefcf,#f0d29b);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#49301f}

button{font:inherit;cursor:pointer;touch-action:manipulation}

.game{height:100vh;height:100dvh;max-width:960px;margin:auto;background:#fff9ed;border-left:3px solid #b98f5a;border-right:3px solid #b98f5a;display:flex;flex-direction:column;padding:8px;overflow:hidden}

header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;background:#f8edda;padding:8px;border-radius:14px;margin-bottom:7px}

h1{font-size:clamp(1rem,4vw,1.5rem);margin:0}

.stats{display:flex;gap:5px;flex-wrap:wrap}

.stat{background:#fff;padding:6px 8px;border-radius:10px;font-size:.86rem;font-weight:800}

.top-fixed{flex-shrink:0;min-height:0}

.section{background:#f5e7d0;border-radius:15px;padding:9px;margin-bottom:8px;border:2px solid #e3c9a4}

.section h2{font-size:.95rem;margin:0 0 7px}

.queue{display:flex;gap:7px;overflow-x:auto;min-height:0;padding:2px 2px 6px;overscroll-behavior-x:contain}

.customer{flex:0 0 92px;background:#fffaee;border:2px solid #dab27c;border-radius:12px;padding:6px;text-align:center;box-shadow:0 3px 0 #ba9a6b}

.face{font-size:1.8rem}

.order{font-weight:800;margin:3px 0;font-size:.83rem}

.patience{height:7px;background:#e8d8c2;border-radius:12px;overflow:hidden}

.patience i{display:block;height:100%;background:#4e9d5a}

.patience.low i{background:#d44c3a}

.small{font-size:.7rem;margin-top:3px}

.empty{padding:14px 8px;text-align:center;width:100%;opacity:.7}

.scroll-area{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px;-webkit-overflow-scrolling:touch}

.kitchen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.station{background:#fff6e6;border-radius:13px;padding:8px;border:2px solid #dbbd8b;min-width:0}

.station h3{font-size:.9rem;margin:0 0 6px}

.desc{font-size:.72rem;color:#7a5d3e;margin-bottom:7px;line-height:1.4}

.cook{width:100%;border:0;border-radius:9px;background:#a07445;color:white;font-weight:800;padding:9px 4px;font-size:.84rem}

.cook:disabled{opacity:.45}

.slots{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

.slot{flex:1 1 65px;min-width:0;border-radius:10px;background:#fcf5e8;border:1px solid #dbbd8b;padding:6px 3px;text-align:center;font-size:.72rem;overflow-wrap:anywhere}

.slot .icon{font-size:1.25rem;display:block}

.slot.cooking{background:#f9e9c8;border-color:#c9a25e}

.slot.ready{background:#dff0d8;border-color:#7db87a}

.slot.burnt{background:#2f2a25;color:#eee;border-color:#1e1a17}

.slot button{border:0;border-radius:8px;padding:7px 2px;font-size:.7rem;font-weight:800;background:#4e8155;color:white;width:100%;margin-top:5px}

.slot.burnt button{background:#b84334}

.message{min-height:42px;background:#f6e9d6;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.88rem;margin:8px 0}

.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:4px}

.hint{font-size:.75rem;line-height:1.45;flex:1;color:#6d5436}

.reset{background:#517a58;border:0;border-radius:22px;color:white;font-weight:800;padding:10px 14px;flex-shrink:0}

@media(max-width:400px){

 .game{padding:6px}

 .stat{padding:5px 6px;font-size:.78rem}

 .section{padding:7px}

 .customer{flex-basis:84px}

 .station{padding:6px}

 .station h3{font-size:.82rem}

 .desc{font-size:.68rem}

 .slot{font-size:.68rem}

}

@media(max-height:650px){

 header{padding:5px;margin-bottom:5px}

 .section{padding:6px;margin-bottom:5px}

 .section h2{margin-bottom:4px}

 .customer{padding:4px}

 .face{font-size:1.5rem}

 .queue{padding-bottom:3px}

 .message{margin:5px 0;min-height:34px;padding:6px}

}

</style>

</head>

<body>

<main class="game">

<div class="top-fixed">

<header>

<h1>🍳 早餐店大忙人</h1>

<div class="stats">

<div class="stat">💰 <span id="money">0</span> 元</div>

<div class="stat">⏰ <span id="gameTime">120</span>s</div>

<div class="stat">😊 服務 <span id="served">0</span> 位</div>

</div>

</header>

<section class="section">

<h2>🧍 客人等候區（耐心歸零會離開）</h2>

<div class="queue" id="queue"></div>

</section>

</div>

<div class="scroll-area">

<section class="section">

<h2>👨‍🍳 廚房｜左餐點、右飲料｜每種最多 4 份</h2>

<div class="kitchen" id="kitchen"></div>

</section>

<div class="message" id="message" role="status">先料理餐點，再送給排隊最前面的客人。</div>

<div class="bottom">

<div class="hint">

🍞 吐司、🥞 蛋餅：烤 5 秒，烤好後 5 秒內取出放到盤子。<br>

🍽️ 放到盤子後就不會再烤焦。<br>

🥛 豆漿 4 秒、🧋 奶茶 5 秒，不會烤焦。

</div>

<button class="reset" id="reset">🔄 重新開店</button>

</div>

</div>

</main>

<script>

(()=>{

'use strict';

const FOODS=[

 {key:'toast',name:'烤吐司',emoji:'🍞',cook:5,price:30,grill:true,group:'food'},

 {key:'pancake',name:'蛋餅',emoji:'🥞',cook:5,price:35,grill:true,group:'food'},

 {key:'soymilk',name:'豆漿',emoji:'🥛',cook:4,price:20,grill:false,group:'drink'},

 {key:'milktea',name:'奶茶',emoji:'🧋',cook:5,price:25,grill:false,group:'drink'}

];

const FACES=['👩','👨','👧','👦','👵','👴','🧑','👩‍🦰','👨‍🦱','👱‍♀️','🧔','👩‍🦳','🧓'];

const MAX_PER_FOOD=4;

const CUSTOMER_PATIENCE=35;

const GAME_DURATION=120;

const SPAWN_INTERVAL=6500;

const OVEN_TAKEOUT_MS=5000;

const $=id=>document.getElementById(id);

let money=0,served=0,gameTime=GAME_DURATION,active=false;

let customers=[],items=[],nextId=1,gameTimer=null,spawnTimer=null,lastTick=0;

function food(key){return FOODS.find(f=>f.key===key)}

function say(text,bad=false){

 $('message').textContent=text;

 $('message').style.color=bad?'#b84334':'#3e7b4b';

 $('message').style.background=bad?'#ffeeea':'#f6e9d6';

}

function updateStats(){

 $('money').textContent=money;

 $('served').textContent=served;

 $('gameTime').textContent=Math.ceil(gameTime);

}

function renderQueue(){

 const el=$('queue');

 if(!customers.length){

  el.innerHTML='<div class="empty">🌤️ 目前沒有客人，稍等一下…</div>';

  return;

 }

 el.innerHTML=customers.map((c,i)=>{

  const f=food(c.order);

  const pct=Math.max(0,c.left/c.patience*100);

  return `

  <div class="customer">

   <div class="face">${c.face}</div>

   <div class="order">${f.emoji} ${f.name}</div>

   <div class="patience ${pct<30?'low':''}">

    <i style="width:${pct}%"></i>

   </div>

   <div class="small">耐心 ${Math.ceil(c.left)} 秒</div>

   <div class="small">${i===0?'👈 優先服務':'第 '+(i+1)+' 位'}</div>

  </div>`;

 }).join('');

}

function renderKitchen(){

 const kitchen=$('kitchen');

 kitchen.innerHTML=FOODS.map(f=>{

  const list=items.filter(x=>x.food===f.key);

  const slots=list.length?list.map(x=>{

   const seconds=deadline=>Math.max(0,Math.ceil((deadline-Date.now())/1000));

   if(x.state==='cooking'){

    return `<div class="slot cooking">

     <span class="icon">⏳</span>料理中<br>${seconds(x.readyAt)} 秒

    </div>`;

   }

   if(x.state==='oven'){

    return `<div class="slot cooking">

     <span class="icon">🔥</span><b>烤好了！</b>

     <small>取出倒數 ${seconds(x.ovenDeadline)} 秒</small>

     <button data-takeout="${x.id}">取出放到盤子</button>

    </div>`;

   }

   if(x.state==='plate'){

    return `<div class="slot ready">

     <span class="icon">🍽️</span><b>盤子上</b>

     <small>不會烤焦</small>

     <button data-deliver="${x.id}" ${!customers.length?'disabled':''}>送給客人</button>

    </div>`;

   }

   if(x.state==='burnt'){

    return `<div class="slot burnt">

     <span class="icon">⬛</span><b>烤焦變黑</b>

     <button data-trash="${x.id}">丟掉重做</button>

    </div>`;

   }

   return `<div class="slot ready">

    <span class="icon">${f.emoji}</span><b>已完成</b>

    <button data-deliver="${x.id}" ${!customers.length?'disabled':''}>送給客人</button>

   </div>`;

  }).join(''):'<div class="slot"><span class="icon">➕</span>尚未備餐</div>';

  return `<article class="station" data-group="${f.group}">

   <h3>${f.emoji} ${f.name}（${list.length}/${MAX_PER_FOOD}）</h3>

   <div class="desc">料理 ${f.cook} 秒${f.grill?'｜烤好後 5 秒內取出':'｜不會烤焦'}｜$${f.price}</div>

   <button class="cook" data-cook="${f.key}" ${!active||list.length>=MAX_PER_FOOD?'disabled':''}>＋ 開始料理</button>

   <div class="slots">${slots}</div>

  </article>`;

 }).join('');

 // 固定排列：左上吐司、左下蛋餅；右上豆漿、右下奶茶

 const stations=[...kitchen.querySelectorAll('.station')];

 stations.forEach(s=>{

  const key=s.querySelector('[data-cook]').dataset.cook;

  if(key==='toast'){s.style.gridColumn='1';s.style.gridRow='1'}

  if(key==='pancake'){s.style.gridColumn='1';s.style.gridRow='2'}

  if(key==='soymilk'){s.style.gridColumn='2';s.style.gridRow='1'}

  if(key==='milktea'){s.style.gridColumn='2';s.style.gridRow='2'}

 });

}

function spawnCustomer(){

 if(!active||customers.length>=5)return;

 const f=FOODS[Math.floor(Math.random()*FOODS.length)];

 customers.push({

  id:nextId++,

  face:FACES[Math.floor(Math.random()*FACES.length)],

  order:f.key,

  patience:CUSTOMER_PATIENCE,

  left:CUSTOMER_PATIENCE

 });

 renderQueue();

}

function cook(key){

 if(!active)return;

 const f=food(key);

 if(items.filter(x=>x.food===key).length>=MAX_PER_FOOD){

  say(f.name+'最多只能備餐 4 份！',true);

  return;

 }

 const now=Date.now();

 items.push({

  id:nextId++,food:key,state:'cooking',

  readyAt:now+f.cook*1000,ovenDeadline:0

 });

 say('開始製作 '+f.name+'！');

 renderKitchen();

}

function takeOut(id){

 const item=items.find(x=>x.id===id);

 if(!item||item.state!=='oven')return;

 if(Date.now()>=item.ovenDeadline){

  item.state='burnt';

  say(food(item.food).name+'太晚從烤箱取出，已經烤焦！',true);

 }else{

  item.state='plate';

  say('✅ 已放到盤子！之後不會再烤焦，可以慢慢送餐。');

 }

 renderKitchen();

}

function deliver(id){

 if(!active)return;

 const item=items.find(x=>x.id===id);

 const customer=customers[0];

 if(!item)return;

 if(!customer){say('目前沒有客人！',true);return}

 if(item.state==='cooking'){say('餐點還在料理中，請稍等！',true);return}

 if(item.state==='oven'){say('請先把烤好的餐點取出，放到盤子上！',true);return}

 if(item.state==='burnt'){say('烤焦的餐點不能出餐，請丟掉重做。',true);return}

 if(item.food!==customer.order){

  say('最前面的客人要 '+food(customer.order).name+'，這份是 '+food(item.food).name+'。',true);

  return;

 }

 const f=food(item.food);

 items=items.filter(x=>x.id!==id);

 customers.shift();

 money+=f.price;

 served++;

 updateStats();

 say('✅ 送出 '+f.name+'！收入 +$'+f.price+'。');

 renderQueue();

 renderKitchen();

 if(!customers.length)spawnCustomer();

}

function trash(id){

 items=items.filter(x=>x.id!==id);

 say('已丟掉烤焦的餐點。',true);

 renderKitchen();

}

function endGame(){

 active=false;

 clearInterval(gameTimer);

 clearInterval(spawnTimer);

 gameTimer=spawnTimer=null;

 say('🔔 打烊！總收入 $'+money+'，共服務 '+served+' 位客人。');

 renderKitchen();

}

function tick(){

 if(!active)return;

 const now=Date.now();

 const delta=Math.min((now-lastTick)/1000,1);

 lastTick=now;

 items.forEach(item=>{

  const f=food(item.food);

  if(item.state==='cooking'&&now>=item.readyAt){

   if(f.grill){

    item.state='oven';

    item.ovenDeadline=now+OVEN_TAKEOUT_MS;

    say(f.name+'烤好了！現在有 5 秒把它取出放到盤子上。');

   }else{

    item.state='ready';

    say(f.name+'做好了！可以先放著備餐。');

   }

  }

  if(item.state==='oven'&&now>=item.ovenDeadline){

   item.state='burnt';

   say(f.name+'超過 5 秒沒從烤箱取出，烤焦變黑了！',true);

  }

  // 餐點放上盤子後不再烤焦

 });

 customers.forEach(c=>c.left=Math.max(0,c.left-delta));

 const leaving=customers.filter(c=>c.left<=0);

 if(leaving.length){

  customers=customers.filter(c=>c.left>0);

  say('😣 有客人等太久離開了！',true);

 }

 gameTime=Math.max(0,gameTime-delta);

 updateStats();

 renderQueue();

 renderKitchen();

 if(gameTime<=0)endGame();

}

function startGame(){

 clearInterval(gameTimer);

 clearInterval(spawnTimer);

 money=0;

 served=0;

 gameTime=GAME_DURATION;

 active=true;

 customers=[];

 items=[];

 nextId=1;

 lastTick=Date.now();

 updateStats();

 say('🏪 開店了！先料理餐點，再送給最前面的客人。');

 spawnCustomer();

 renderQueue();

 renderKitchen();

 gameTimer=setInterval(tick,200);

 spawnTimer=setInterval(spawnCustomer,6500);

}

$('kitchen').addEventListener('click',e=>{

 const c=e.target.closest('[data-cook]');

 if(c){cook(c.dataset.cook);return}

 const t=e.target.closest('[data-takeout]');

 if(t){takeOut(Number(t.dataset.takeout));return}

 const d=e.target.closest('[data-deliver]');

 if(d){deliver(Number(d.dataset.deliver));return}

 const x=e.target.closest('[data-trash]');

 if(x)trash(Number(x.dataset.trash));

});

$('reset').addEventListener('click',startGame);

startGame();

})();

</script>

</body>

</html>
