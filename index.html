

<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>早餐店大忙人｜3D 早餐店</title>

<style>

*{box-sizing:border-box}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17120e;color:#fff0d3;font-family:system-ui,sans-serif}

button{cursor:pointer;touch-action:manipulation;font:inherit}

#scene{position:fixed;inset:0}

#scene canvas{display:block;width:100%;height:100%}

.hud{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);pointer-events:none}

header,.customers,.workbench,.status,.footer{pointer-events:auto;background:#211a14ee;border:1px solid #795b3b;border-radius:16px;backdrop-filter:blur(10px)}

header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px;margin-bottom:7px}

h1{font-size:14px;margin:0}

.brand small{display:block;font-size:9px;color:#c8a985;margin-top:3px}

.stats{display:flex;gap:4px}

.stat{border:1px solid #60472f;border-radius:9px;padding:5px;text-align:center;font-size:9px;min-width:45px}

.stat b{display:block;font-size:13px;margin-top:3px}

.customers{padding:9px;margin-bottom:8px}

.heading{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin-bottom:7px}

.queue{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.queue::-webkit-scrollbar{display:none}

.customer{flex:0 0 82px;text-align:center;background:#392b1f;border:1px solid #785636;border-radius:12px;padding:7px 4px;position:relative}

.customer.first{border-color:#ffd18a;background:#624326}

.face{font-size:24px}

.order{font-size:10px;font-weight:bold;margin:3px 0}

.bar{height:5px;background:#211b16;border-radius:9px;overflow:hidden;margin-top:6px}

.bar i{display:block;height:100%;background:#8bd28d}

.meta{font-size:9px;color:#e1c7a6;margin-top:4px}

.middle{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;pointer-events:none}

.tip{background:#211a14d9;border:1px solid #795b3b;border-radius:10px;padding:7px 10px;font-size:10px;text-align:center}

.bottom{pointer-events:auto;display:flex;flex-direction:column;gap:7px}

.status{padding:9px;text-align:center;font-size:11px;font-weight:bold}

.status.bad{color:#ffaaa0;border-color:#a94d40}

.workbench{padding:8px;max-height:36vh;overflow-y:auto;overscroll-behavior:contain}

.worktitle{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;margin-bottom:7px}

.worktitle small{font-size:9px;color:#d0b08b;font-weight:normal}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.station{min-width:0;background:linear-gradient(145deg,#493321,#2a2018);border:1px solid #79583a;border-radius:12px;padding:7px}

.station.drink{background:linear-gradient(145deg,#304639,#1d2c23);border-color:#456c50}

.station:nth-child(1){grid-column:1;grid-row:1}

.station:nth-child(2){grid-column:1;grid-row:2}

.station:nth-child(3){grid-column:2;grid-row:1}

.station:nth-child(4){grid-column:2;grid-row:2}

.station h3{font-size:11px;margin:0 0 4px}

.station p{font-size:9px;color:#d8b995;margin:0 0 7px}

.station button{width:100%;border:0;border-radius:8px;padding:8px 3px;background:#e4ad67;color:#29190c;font-size:10px;font-weight:bold}

.drink button{background:#9fd3a1}

.station button:disabled{opacity:.35}

.items{display:flex;flex-direction:column;gap:5px;margin-top:6px}

.item{background:#211912;border:1px solid #705238;border-radius:8px;padding:6px;font-size:10px}

.item.ready{background:#1c2c20;border-color:#4e8759}

.item.burnt{background:#351b18;border-color:#a7473c}

.item button{margin-top:5px;background:#8b633b;color:white;padding:6px}

.item.ready button{background:#4e8d58}

.item.burnt button{background:#a34137}

.empty{font-size:9px;color:#ad9273;text-align:center;padding:7px}

.footer{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:7px;font-size:9px;color:#d5b894}

.reset{background:#493523;border:1px solid #795b3b;color:#ffe5c2;border-radius:9px;padding:8px;font-size:10px;white-space:nowrap}

.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:20px}

.overlay.show{display:flex}

.modal{background:#2a2018;border:1px solid #94704a;border-radius:20px;padding:25px;text-align:center;width:100%;max-width:320px}

.modal button{width:100%;padding:12px;border:0;border-radius:10px;background:#ffd18a;font-weight:bold}

@media(max-height:700px){.customers{padding:6px;margin-bottom:5px}.customer{padding:5px}.face{font-size:20px}.workbench{max-height:32vh}}

</style>

</head>

<body>

<div id="scene"></div>

<div class="hud">

<header>

 <div class="brand"><h1>🍳 早餐店大忙人</h1><small>3D BREAKFAST CLUB</small></div>

 <div class="stats">

  <div class="stat">💰 收入<b id="money">$0</b></div>

  <div class="stat">⏱ 剩餘<b id="time">120</b></div>

  <div class="stat">😊 服務<b id="served">0</b></div>

 </div>

</header>

<section class="customers">

 <div class="heading"><span>👥 客人訂單</span><span style="color:#9fe2a3">● 營業中</span></div>

 <div class="queue" id="queue"></div>

</section>

<div class="middle"><div class="tip" id="tip">3D 早餐廚房｜開始製作你的第一份餐點</div></div>

<div class="bottom">

 <div class="status" id="message">🏪 開店了！請查看第一位客人的訂單。</div>

 <section class="workbench">

  <div class="worktitle"><span>🍽️ 廚房工作台</span><small>左側餐點 · 右側飲料</small></div>

  <div class="grid" id="grid"></div>

 </section>

 <div class="footer">

  <span>吐司／蛋餅烤好後 5 秒內取出，放盤後不會焦。</span>

  <button class="reset" id="reset">↻ 重新開店</button>

 </div>

</div>

</div>

<div class="overlay" id="over">

 <div class="modal">

  <div style="font-size:42px">🌙</div>

  <h2>今日打烊</h2>

  <p id="result"></p>

  <button id="again">再開一次店</button>

 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(()=>{

'use strict';

const FOODS=[

 {key:'toast',name:'吐司',emoji:'🍞',cook:5,price:30,grill:true,drink:false,color:0xe0a34e},

 {key:'pancake',name:'蛋餅',emoji:'🥞',cook:5,price:35,grill:true,drink:false,color:0xf2c65e},

 {key:'soymilk',name:'豆漿',emoji:'🥛',cook:4,price:20,grill:false,drink:true,color:0xe9dbb9},

 {key:'milktea',name:'奶茶',emoji:'🧋',cook:5,price:25,grill:false,drink:true,color:0x99572f}

];

const FACES=['👩','👨','👧','👦','👵','👴','🧑','👩‍🦰','👨‍🦱'];

const $=id=>document.getElementById(id);

const MAX=4, DURATION=120, PATIENCE=35;

let money=0,served=0,time=120,active=false,customers=[],items=[],nextId=1,timer=null,spawner=null,lastTick=0;

const food=k=>FOODS.find(f=>f.key===k);

function message(s,bad=false){$('message').textContent=s;$('message').classList.toggle('bad',bad)}

function updateStats(){$('money').textContent='$'+money;$('served').textContent=served;$('time').textContent=Math.ceil(time)}

function renderQueue(){

 const el=$('queue');

 if(!customers.length){el.innerHTML='<div class="empty">☕ 等待下一位客人⋯</div>';return}

 el.innerHTML=customers.map((c,i)=>{

  const f=food(c.order),pct=Math.max(0,c.left/PATIENCE*100);

  return `<div class="customer ${i===0?'first':''}">

   <div class="face">${c.face}</div><div class="order">${f.emoji} ${f.name}</div>

   <div class="bar"><i style="width:${pct}%;background:${pct<30?'#ff6657':'#8bd28d'}"></i></div>

   <div class="meta">${i===0?'下一位':'第 '+(i+1)+' 位'} · ${Math.ceil(c.left)}秒</div>

  </div>`;

 }).join('');

}

function renderGrid(){

 $('grid').innerHTML=FOODS.map(f=>{

  const list=items.filter(x=>x.food===f.key);

  const rows=list.length?list.map(x=>{

   const seconds=deadline=>Math.max(0,Math.ceil((deadline-Date.now())/1000));

   if(x.state==='cooking')return `<div class="item"><b>⏳ ${f.name}製作中</b><div>剩餘 ${seconds(x.readyAt)} 秒</div></div>`;

   if(x.state==='oven')return `<div class="item"><b>🔥 烤好了！</b><div>取出倒數 ${seconds(x.deadline)} 秒</div><button data-take="${x.id}">取出放到盤子</button></div>`;

   if(x.state==='plate')return `<div class="item ready"><b>🍽️ 已放到盤子</b><div>安全保存，不會烤焦</div><button data-serve="${x.id}" ${!customers.length?'disabled':''}>送給客人</button></div>`;

   if(x.state==='ready')return `<div class="item ready"><b>${f.emoji} 已完成</b><div>不會烤焦</div><button data-serve="${x.id}" ${!customers.length?'disabled':''}>送給客人</button></div>`;

   return `<div class="item burnt"><b>⬛ 餐點烤焦了</b><button data-trash="${x.id}">丟掉重做</button></div>`;

  }).join(''):'<div class="empty">尚未備餐</div>';

  return `<div class="station ${f.drink?'drink':''}">

   <h3>${f.emoji} ${f.name}　$${f.price}</h3>

   <p>製作 ${f.cook} 秒 · 已備 ${list.length}/${MAX}</p>

   <button data-cook="${f.key}" ${!active||list.length>=MAX?'disabled':''}>＋ 開始製作</button>

   <div class="items">${rows}</div>

  </div>`;

 }).join('');

}

function spawn(){

 if(!active||customers.length>=5)return;

 const f=FOODS[Math.floor(Math.random()*FOODS.length)];

 customers.push({id:nextId++,face:FACES[Math.floor(Math.random()*FACES.length)],order:f.key,left:PATIENCE});

 renderQueue();

}

function cook(key){

 if(!active)return;

 const f=food(key);

 if(items.filter(x=>x.food===key).length>=MAX){message(f.name+'最多只能備餐 4 份！',true);return}

 const now=Date.now();

 items.push({id:nextId++,food:key,state:'cooking',readyAt:now+f.cook*1000,deadline:0});

 message('👨‍🍳 開始製作 '+f.name+'！');

 renderGrid();

}

function take(id){

 const x=items.find(x=>x.id===id);

 if(!x||x.state!=='oven')return;

 if(Date.now()>=x.deadline){x.state='burnt';message(food(x.food).name+'超時烤焦了！',true)}

 else{x.state='plate';message('🍽️ 已放到盤子上！之後不會再烤焦。')}

 renderGrid();

}

function serve(id){

 if(!active)return;

 const x=items.find(x=>x.id===id),c=customers[0];

 if(!x)return;

 if(!c){message('目前沒有客人。',true);return}

 if(x.state==='cooking'){message('餐點還在製作中！',true);return}

 if(x.state==='oven'){message('請先取出放到盤子！',true);return}

 if(x.state==='burnt'){message('烤焦餐點不能出餐。',true);return}

 if(x.food!==c.order){message('下一位客人要的是 '+food(c.order).name+'！',true);return}

 const f=food(x.food);

 items=items.filter(a=>a.id!==id);customers.shift();money+=f.price;served++;

 updateStats();message('✅ 成功送出 '+f.name+'，收入 +$'+f.price+'！');

 renderQueue();renderGrid();if(!customers.length)spawn();

}

function trash(id){items=items.filter(x=>x.id!==id);renderGrid();message('已丟掉烤焦餐點。')}

function tick(){

 if(!active)return;

 const now=Date.now(),delta=Math.min((now-lastTick)/1000,1);lastTick=now;

 items.forEach(x=>{

  const f=food(x.food);

  if(x.state==='cooking'&&now>=x.readyAt){

   if(f.grill){x.state='oven';x.deadline=x.readyAt+5000;message(f.name+'烤好了！5 秒內取出放盤。')}

   else{x.state='ready';message(f.name+'做好了，可以直接出餐。')}

  }

  if(x.state==='oven'&&now>=x.deadline){x.state='burnt';message(f.name+'超過 5 秒沒取出，烤焦了！',true)}

 });

 customers.forEach(c=>c.left=Math.max(0,c.left-delta));

 if(customers.some(c=>c.left<=0)){customers=customers.filter(c=>c.left>0);message('😣 有客人等太久離開了！',true)}

 time=Math.max(0,time-delta);updateStats();renderQueue();renderGrid();

 if(time<=0)endGame();

}

function endGame(){

 active=false;clearInterval(timer);clearInterval(spawner);

 $('result').textContent='總收入 $'+money+'，服務 '+served+' 位客人。';

 $('over').classList.add('show');

}

function start(){

 clearInterval(timer);clearInterval(spawner);

 money=0;served=0;time=DURATION;active=true;customers=[];items=[];nextId=1;lastTick=Date.now();

 $('over').classList.remove('show');updateStats();renderGrid();spawn();

 message('🏪 開店了！請查看第一位客人的訂單。');

 timer=setInterval(tick,200);spawner=setInterval(spawn,6500);

}

$('grid').addEventListener('click',e=>{

 const b=e.target.closest('button');if(!b)return;

 if(b.dataset.cook)cook(b.dataset.cook);

 if(b.dataset.take)take(+b.dataset.take);

 if(b.dataset.serve)serve(+b.dataset.serve);

 if(b.dataset.trash)trash(+b.dataset.trash);

});

$('reset').addEventListener('click',start);

$('again').addEventListener('click',start);

// Three.js 低多邊形早餐廚房

let scene,camera,renderer,clock;

function material(color,roughness=.8,metalness=0){

 return new THREE.MeshStandardMaterial({color,roughness,metalness});

}

function box(w,h,d,color,x,y,z,rough=.8){

 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color,rough));

 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;

}

function cyl(rt,rb,h,color,x,y,z,segments=16){

 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material(color,.45,.25));

 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;

}

function sphere(r,color,x,y,z,segments=10){

 const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),material(color));

 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;

}

function createScene(){

 if(!window.THREE){$('tip').textContent='3D 載入失敗，請確認網路後重新整理。';return}

 const host=$('scene');

 scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc7d6);scene.fog=new THREE.Fog(0x9fc7d6,14,28);

 camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);

 camera.position.set(0,10.5,13);camera.lookAt(0,0,0);

 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});

 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);

 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;

 renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffe8c8,0x4b5b60,2.3));

 const sun=new THREE.DirectionalLight(0xffd5a0,3.1);sun.position.set(-5,10,7);sun.castShadow=true;scene.add(sun);

 const fill=new THREE.PointLight(0xffa64e,18,18);fill.position.set(3,5,-2);scene.add(fill);

 buildKitchen();clock=new THREE.Clock();animate();

 addEventListener('resize',resize);

}

function buildKitchen(){

 const wood=0x986239,lightWood=0xb78049,dark=0x332a26,steel=0x9ca9a9;

 box(20,.3,20,0x5b422d,0,-.65,0);

 box(11,.35,8,wood,0,-.12,0);

 for(let i=0;i<18;i++)box(10.9,.015,.035,lightWood,0,.065,-3.8+i*.44);

 // café backsplash and windows

 box(11,2.7,.18,0x527a70,0,1.1,-3.9);

 box(11,.16,.2,lightWood,0,2.5,-3.75);

 for(let x=-4.8;x<=4.8;x+=2.4)box(.07,2.4,.12,0xe1c99d,x,1.2,-3.7);

 for(let x=-4.8;x<=4.8;x+=.8)box(.025,2.2,.13,0xb4d4d4,x,1.2,-3.65);

 // oven on left

 box(2.3,1.35,1.55,0xc2c7c4,-3.25,.75,-1.25,.35);

 box(1.9,.75,.1,0x303438,-3.25,.65,-.44,.35);

 box(1.65,.53,.04,0x5c2f19,-3.25,.66,-.37,.3);

 box(1.45,.06,.05,0xffb354,-3.25,.95,-.34,.3);

 for(let i=0;i<2;i++)box(.53,.08,.4,0x6c4b2c,-3.65+i*.8,.45,-.05);

 for(let i=0;i<2;i++)box(.4,.1,.32,0xe6a84e,-3.65+i*.8,.53,-.05);

 for(let i=0;i<2;i++)cyl(.09,.09,.09,0x3d4546,-2.2,.83,-.4,12);

 // pan in center

 cyl(1.2,1.3,.18,0x262b30,0,.27,-.1,24);

 cyl(1.08,1.12,.07,0x4b4e4d,0,.39,-.1,24);

 cyl(.78,.82,.1,0xe9bd53,0,.46,-.1,20);

 sphere(.18,0xffe8a1,0,.54,-.1,12);

 const handle=box(.2,.12,1.2,0x292c2e,0,.3,1.15);handle.rotation.x=-.08;

 box(.22,.14,.35,0x704729,0,.3,1.78);

 // toast and plates

 cyl(.65,.69,.08,0xf3eadb,2.1,.19,-1.6,24);

 box(.75,.13,.65,0xd79a4d,2.1,.31,-1.6);

 box(.62,.025,.52,0xf4d7a0,2.1,.39,-1.6);

 cyl(.55,.6,.07,0xf3eadb,2.2,.19,-.2,24);

 cyl(.38,.4,.06,0xf1c65b,2.2,.25,-.2,20);

 sphere(.12,0xffe6a2,2.2,.31,-.2,10);

 // drink machines, cups

 for(let i=0;i<3;i++){

  const x=1.5+i*.95;

  box(.72,.82,.7,[0x8aa9a7,0xa8c1b9,0x789b9a][i],x,.57,-3, .3);

  box(.55,.12,.52,steel,x,1.04,-3,.3);

  cyl(.23,.24,.06,0x3a4141,x,.17,-3,16);

 }

 function cup(x,z,color,bubble){

  cyl(.25,.31,.55,color,x,.48,z,12);

  cyl(.27,.27,.06,0xf1e8d5,x,.78,z,12);

  cyl(.035,.035,.22,0x35271d,x+.05,.91,z,8);

  if(bubble)for(let i=0;i<7;i++)sphere(.035,0x24150f,x-.14+(i%4)*.08,.23,z+(Math.floor(i/4))*.08,6);

 }

 cup(1.5,-1.9,0xe6d6b8,false);cup(2.45,-1.9,0x9b5b34,true);cup(3.4,-1.9,0xe4d4b2,false);

 // egg roll cutting board

 box(2.5,.13,1.2,lightWood,-3,.22,1.8);

 box(2.15,.025,.88,0xd9b47d,-3,.3,1.8);

 for(let i=0;i<3;i++){

  const roll=cyl(.16,.16,.75,0xf1d18a,-3.55+i*.48,.43,1.8,12);roll.rotation.z=Math.PI/2;

  for(let j=0;j<3;j++)sphere(.025,0x638b45,-3.55+i*.48-.2+j*.16,.51,1.8,5);

 }

 // tea counter

 box(1.35,.16,1.1,lightWood,3,.18,1.8);

 cyl(.32,.35,.7,0x995a34,3,.59,1.8,16);

 cyl(.35,.35,.07,steel,3,.96,1.8,16);

 cyl(.05,.05,.3,0x292929,3.05,1.14,1.8,8);

 // garnish bowls and plants

 for(let i=0;i<5;i++)cyl(.1,.12,.18,[0x6d9149,0xd5a447,0xb44c38][i%3],-4.5+i*.38,.33,2.7,8);

 cyl(.23,.28,.35,0xc48b53,4.55,.28,-3.1,10);

 for(let i=0;i<7;i++){

  const leaf=sphere(.16,i%2?0x4e8051:0x79a25c,4.55+Math.cos(i*2.3)*.23,.67+(i%3)*.1,-3.1+Math.sin(i*2.3)*.22,5);

  leaf.scale.set(.65,1.5,.55);

 }

 // hanging lights

 for(const x of [-3,0,3]){

  cyl(.025,.025,.65,0x4a3020,x,2.8,-2.7,8);

  sphere(.17,0xffd17b,x,2.43,-2.7,10);

 }

}

function animate(){requestAnimationFrame(animate);if(renderer&&scene){const t=clock.getElapsedTime();renderer.render(scene,camera)}}

function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?52:43;camera.position.set(0,innerWidth<600?12.5:10.5,innerWidth<600?15:13);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}

try{createScene()}catch(err){console.error(err);$('tip').textContent='3D 場景載入失敗，請重新整理。'}

start();

})();

</script>

</body>

</html>
